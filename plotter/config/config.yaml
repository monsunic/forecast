# ========================================================
# FORECAST RUN SETTINGS
# ========================================================
forecast:
  # Lead-time window: F000 … F{max_hours} at hour_step (inclusive).
  # Default: 3-day forecast at 3-hourly (F000, F003, …, F072).
  max_hours: 72
  hour_step: 3
  # Per-dataset stride overrides (each must be a multiple of hour_step, so the
  # 3-hourly schedule stays a superset). Ocean surface fields evolve slowly, so
  # HYCOM renders 6-hourly (13 frames, not 25): roughly halves its runtime and
  # its exposure to NCSS download stalls, while waves/atmosphere stay 3-hourly.
  dataset_hour_step:
    hycom: 6

# ========================================================
# GLOBAL FALLBACK DEFAULTS
# ========================================================
defaults:
  proj: mercator
  dpi: 100
  figsize: [8, 6]
  fileformat: "webp"
  quiver:
    width: 0.002
    headwidth: 5
    headlength: 5
    headaxislength: 3
    minlength: 0.1
    minshaft: 0.1
    pivot: "middle"
    # width/height ratio at/above which a map counts as "landscape".
    landscape_aspect: 1.5
    # Arrows per figure-inch along each edge. Portrait packs denser; landscape
    # stays looser so the long edge isn't a wall of arrows.
    per_inch_landscape: 1.9
    per_inch_portrait: 2.6
    # Direction arrow length = arrow_frac × shorter map side. Landscape maps have
    # a short vertical span, so they use a larger fraction to look bigger.
    arrow_frac: 0.024
    arrow_frac_landscape: 0.050
  windbarb:
    length: 5.0
    barbcolor: black
    linewidth: 0.45
    pivot: middle
    per_inch_landscape: 1.9
    per_inch_portrait: 2.6

# ========================================================
# PRODUCT CATALOG (metadata + plot types)
# ========================================================
products:

  wind:
    slug: wind
    ui_key: surface_wind
    dataset: gfswave
    model: GFS
    forecast_type: "Wind and Waves"
    status: production
    plot:
