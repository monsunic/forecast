# ========================================================
products:

  wind:
    slug: wind
    ui_key: surface_wind
    dataset: gfswave
    model: GFS
    forecast_type: "Wind and Waves"
    status: production
    plot:
      scalar:
        method: contourf
        colormap_type: discrete
      vector:
        method: windbarb
        overlay: true
      colorbar:
