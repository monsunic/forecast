# ========================================================
# REGION DEFINITIONS
# ========================================================
regions:

  malacca_strait:
    bbox: [95, 105, 0, 6]

  south_china_sea:
    bbox: [105.5, 121, 6, 25]

  philippines:
    bbox: [116, 130, 6, 20]

  andaman_gulf_thailand:
    bbox: [90, 105.5, 6, 18]

  java_nusa_tenggara:
    bbox: [103, 128, -13, -3]

  western_indo:
    bbox: [95, 120, -13, 6]

  eastern_indo:
    bbox: [120, 141, -13, 6]

  indonesia:
    bbox: [90, 141, -13, 6]

  southeast_asia:
    bbox: [90, 150, -20, 25]

# ========================================================
# SITE FORECAST LOCATIONS (fixed ports)
# ========================================================
sites:
  # Ordered alphabetically by display name. Coordinates are the reference port
  # locations from Google Maps / UN-LOCODE (nearest wet grid cell is sampled at
  # extraction time, so land-side port centroids are fine here).
  haiphong:
    name: Port of Hai Phong
    lat: 20.8500
    lon: 106.6833
  ho_chi_minh:
    name: Saigon Port (Ho Chi Minh)
    lat: 10.7683
    lon: 106.7075
  laem_chabang:
    name: Laem Chabang Port
    lat: 13.0833
    lon: 100.8833
  manila:
    name: Port of Manila
    lat: 14.5967
    lon: 120.9544
  port_klang:
    name: Port Klang
    lat: 2.9996
    lon: 101.3929
  singapore:
    name: Port of Singapore
    lat: 1.2644
    lon: 103.8200
  tanjung_perak:
    name: Tanjung Perak (Surabaya)
    lat: -7.1983
    lon: 112.7228
  tanjung_priok:
    name: Tanjung Priok (Jakarta)
    lat: -6.1040
    lon: 106.8865

# ========================================================
# ROUTE FORECAST LANE GRAPH (manual corridors)
# ========================================================
# Fallback lane network used when no AIS-derived graph is available. Waypoints
# trace the common commercial corridors (Malacca/Singapore Strait, Gulf of
# Thailand, South China Sea, Karimata/Java Sea) and must sit in navigable
# water. Ports are referenced by their `sites:` id above.
# Rebuild the graph with: python scripts/build_route_graph.py --source auto
routes:
  waypoints:
    # --- Malacca and Singapore Strait ---
    wp_malacca_n: {lat: 4.80, lon: 98.80}
    wp_malacca_mid: {lat: 3.20, lon: 100.40}
    wp_klang_app: {lat: 2.95, lon: 101.10}
    wp_malacca_s: {lat: 1.75, lon: 102.80}
    wp_sing_w: {lat: 1.22, lon: 103.55}
    wp_sing_e: {lat: 1.16, lon: 104.20}
    # --- East Malaysia coast and Gulf of Thailand ---
    wp_tioman: {lat: 2.80, lon: 104.60}
    wp_gulf_s: {lat: 6.50, lon: 103.20}
    wp_gulf_c: {lat: 10.00, lon: 101.80}
    wp_laem_app: {lat: 12.90, lon: 100.95}
    # Eastern gulf exit into the SCS (avoids the Malay-coast / Singapore detour
    # for Gulf of Thailand → Philippines voyages).
    wp_gulf_e: {lat: 9.80, lon: 103.80}
    # --- South China Sea ---
    wp_scs_s: {lat: 2.20, lon: 105.20}
    wp_natuna: {lat: 3.50, lon: 106.80}
    wp_scs_c: {lat: 7.50, lon: 107.80}
    wp_vung_tau: {lat: 10.20, lon: 107.30}
    wp_scs_n: {lat: 14.00, lon: 109.80}
    wp_tonkin_e: {lat: 18.50, lon: 107.60}
    wp_haiphong_app: {lat: 20.60, lon: 107.00}
    # Mid-SCS mesh so the router can pick weather-aware tracks toward Manila
    # without collapsing onto a single Singapore–Natuna trunk.
    wp_scs_sw: {lat: 8.80, lon: 105.80}
    wp_scs_mid: {lat: 10.50, lon: 112.00}
    wp_scs_cs: {lat: 7.00, lon: 112.50}
    wp_scs_cn: {lat: 13.00, lon: 112.50}
    wp_scs_ne: {lat: 12.50, lon: 115.50}
    wp_scs_e: {lat: 13.20, lon: 118.20}
    wp_manila_app: {lat: 14.55, lon: 120.40}
    # --- Karimata Strait and Java Sea ---
    # East of Bintan/Lingga: the Singapore-Jakarta lane must clear the Riau
    # archipelago rather than cut across it.
    wp_bintan_e: {lat: 1.05, lon: 104.90}
    wp_riau_e: {lat: -0.20, lon: 105.30}
    wp_karimata_n: {lat: -1.00, lon: 105.80}
    wp_karimata_s: {lat: -3.50, lon: 107.20}
    wp_java_w: {lat: -5.60, lon: 106.95}
    wp_priok_app: {lat: -5.98, lon: 106.89}
    wp_java_c: {lat: -5.80, lon: 110.50}
    wp_perak_app: {lat: -6.90, lon: 112.72}

  # Undirected lane segments; the router traverses them in both directions.
  edges:
    - [port_klang, wp_klang_app]
    - [wp_klang_app, wp_malacca_mid]
    - [wp_malacca_mid, wp_malacca_n]
    - [wp_klang_app, wp_malacca_s]
    - [wp_malacca_s, wp_sing_w]
    - [wp_sing_w, singapore]
    - [singapore, wp_sing_e]
    - [wp_sing_w, wp_sing_e]
    - [wp_sing_e, wp_tioman]
    - [wp_tioman, wp_gulf_s]
    - [wp_gulf_s, wp_gulf_c]
    - [wp_gulf_c, wp_laem_app]
    - [wp_laem_app, laem_chabang]
    # Direct Gulf of Thailand → South China Sea (commercial eastbound exit)
    - [wp_gulf_c, wp_gulf_e]
    - [wp_gulf_e, wp_scs_sw]
    - [wp_gulf_s, wp_scs_sw]
    - [wp_gulf_e, wp_vung_tau]
    - [wp_scs_sw, wp_scs_c]
    - [wp_scs_sw, wp_vung_tau]
    - [wp_sing_e, wp_scs_s]
    - [wp_scs_s, wp_natuna]
    - [wp_natuna, wp_scs_c]
    - [wp_scs_c, wp_vung_tau]
    - [wp_vung_tau, ho_chi_minh]
    - [wp_scs_c, wp_scs_n]
    - [wp_scs_n, wp_tonkin_e]
    - [wp_tonkin_e, wp_haiphong_app]
    - [wp_haiphong_app, haiphong]
    # SCS mesh toward Manila (north / mid / south alternatives)
    - [wp_scs_c, wp_scs_mid]
    - [wp_scs_c, wp_scs_cs]
    - [wp_vung_tau, wp_scs_mid]
    - [wp_vung_tau, wp_scs_cn]
    - [wp_scs_n, wp_scs_cn]
    - [wp_scs_n, wp_scs_mid]
    - [wp_scs_mid, wp_scs_cn]
    - [wp_scs_mid, wp_scs_cs]
    - [wp_scs_mid, wp_scs_ne]
    - [wp_scs_mid, wp_scs_e]
    - [wp_scs_cn, wp_scs_ne]
    - [wp_scs_cn, wp_scs_e]
    - [wp_scs_cs, wp_scs_ne]
    - [wp_scs_cs, wp_natuna]
    - [wp_natuna, wp_scs_ne]
    - [wp_scs_n, wp_scs_ne]
    - [wp_scs_ne, wp_scs_e]
    - [wp_scs_ne, wp_manila_app]
    - [wp_scs_e, wp_manila_app]
    - [wp_manila_app, manila]
    - [wp_scs_s, wp_karimata_n]
    - [wp_sing_e, wp_bintan_e]
    - [wp_bintan_e, wp_riau_e]
    - [wp_riau_e, wp_karimata_n]
    - [wp_karimata_n, wp_karimata_s]
    - [wp_karimata_s, wp_java_w]
    - [wp_java_w, wp_priok_app]
    - [wp_priok_app, tanjung_priok]
    - [wp_java_w, wp_java_c]
    - [wp_java_c, wp_perak_app]
    - [wp_perak_app, tanjung_perak]

# ========================================================
# FORECAST RUN SETTINGS
# ========================================================
forecast:
  # Lead-time window: F000 … F{max_hours} at hour_step (inclusive).
  # Default: 3-day forecast at 3-hourly (F000, F003, …, F072).
  max_hours: 72
  hour_step: 3
  # Per-dataset stride overrides (each must be a multiple of hour_step, so the
  # 3-hourly schedule stays a superset). Ocean surface fields evolve slowly, so
  # HYCOM renders 6-hourly (13 frames, not 25): roughly halves its runtime and
  # its exposure to NCSS download stalls, while waves/atmosphere stay 3-hourly.
  dataset_hour_step:
    hycom: 6

# ========================================================
# GLOBAL FALLBACK DEFAULTS
# ========================================================
defaults:
  proj: mercator
  dpi: 100
  figsize: [8, 6]
  fileformat: "webp"
  quiver:
    width: 0.002
    headwidth: 5
    headlength: 5
    headaxislength: 3
    minlength: 0.1
    minshaft: 0.1
    pivot: "middle"
    # width/height ratio at/above which a map counts as "landscape".
    landscape_aspect: 1.5
    # Arrows per figure-inch along each edge. Portrait packs denser; landscape
    # stays looser so the long edge isn't a wall of arrows.
    per_inch_landscape: 1.9
    per_inch_portrait: 2.6
    # Direction arrow length = arrow_frac × shorter map side. Landscape maps have
    # a short vertical span, so they use a larger fraction to look bigger.
    arrow_frac: 0.024
    arrow_frac_landscape: 0.050
  windbarb:
    length: 5.0
    barbcolor: black
    linewidth: 0.45
    pivot: middle
    per_inch_landscape: 1.9
    per_inch_portrait: 2.6

# ========================================================
